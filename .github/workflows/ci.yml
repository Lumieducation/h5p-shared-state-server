name: CI

on:
    push:
        branches:
            - '**'
    pull_request:
    workflow_dispatch:

env:
    NODE_VERSION: '24.19.0'

jobs:
    install-build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
            - run: npm ci
            - run: npm run build
            # actions/upload-artifact zips the workspace and does not
            # preserve symlinks or Unix execute permissions (it dereferences
            # them into flat file copies). node_modules/.bin/* entries are
            # symlinks that need their execute bit, so a plain
            # upload/download round-trip leaves eslint/prettier/vitest
            # unrunnable ("Permission denied"). tar preserves symlinks and
            # permissions natively, so archive first and let upload-artifact
            # ship a single opaque file.
            - name: Archive workspace
              run: tar -czf workspace.tar.gz node_modules build
            - uses: actions/upload-artifact@v4
              with:
                  name: workspace
                  retention-days: 1
                  compression-level: 0
                  path: workspace.tar.gz

    lint:
        needs: install-build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
            - uses: actions/download-artifact@v4
              with:
                  name: workspace
            - name: Extract workspace
              run: tar -xzf workspace.tar.gz
            - run: npm run lint

    format:
        needs: install-build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
            - uses: actions/download-artifact@v4
              with:
                  name: workspace
            - name: Extract workspace
              run: tar -xzf workspace.tar.gz
            - run: npm run format:check

    unit-tests:
        needs: install-build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
            - uses: actions/download-artifact@v4
              with:
                  name: workspace
            - name: Extract workspace
              run: tar -xzf workspace.tar.gz
            - run: npx vitest run --config vitest.config.ts --coverage
